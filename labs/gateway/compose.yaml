services:
  gateway:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-45103}:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - relay
  relay:
    image: python:3.13-alpine
    command: ["python", "/app/relay.py"]
    volumes:
      - ./relay.py:/app/relay.py:ro
