let selected = null;
// trunk and segments
svg.append('rect').attr('class', 'bark').attr('x', cx - TRUNK / 2).attr('y', spineY(SPINE.length - 1) - 40).attr('width', TRUNK).attr('height', spineY(0) - spineY(SPINE.length - 1) + 80).attr('rx', 60);
const segs = [];
SPINE.forEach((id, i) => { const b = byId.get(id).block; if (!segs.length || segs[segs.length - 1].block !== b) segs.push({ block: b, color: byId.get(id).color, from: i, to: i }); else segs[segs.length - 1].to = i; });
const segG = svg.append('g');
segs.forEach(s => {
  const y1 = spineY(s.to) - STEP / 2, y2 = spineY(s.from) + STEP / 2;
  segG.append('rect').attr('class', 'seg').attr('x', cx - TRUNK / 2 + 6).attr('y', y1).attr('width', TRUNK - 12).attr('height', y2 - y1).attr('fill', s.color).attr('rx', 18);
  segG.append('text').attr('class', 'seg-label').attr('x', cx - TRUNK / 2 - 18).attr('y', (y1 + y2) / 2).attr('text-anchor', 'end').text(s.block);
  segG.append('text').attr('class', 'seg-sub').attr('x', cx - TRUNK / 2 - 18).attr('y', (y1 + y2) / 2 + 16).attr('text-anchor', 'end').text(`${s.to - s.from + 1} заданий`);
});
// limbs
const limbG = svg.append('g');
NODES.filter(n => !idx.has(n.id)).forEach(n => {
  const p = pos.get(n.id), q = pos.get(p.parent);
  const sx = q.side === 0 ? cx + p.side * (TRUNK / 2 - 10) : q.x;
  limbG.append('path').attr('class', 'limb').attr('stroke', n.color).attr('d', `M${sx},${q.y} C${(sx + p.x) / 2},${q.y} ${(sx + p.x) / 2},${p.y} ${p.x},${p.y}`);
});
// limb labels at the first node of each branch
const seenBranch = new Set();
NODES.filter(n => !idx.has(n.id) && n.branch && idx.has(pos.get(n.id).parent)).forEach(n => {
  if (seenBranch.has(n.branch + pos.get(n.id).parent)) return; seenBranch.add(n.branch + pos.get(n.id).parent);
  const p = pos.get(n.id);
  svg.append('text').attr('class', 'limb-label').attr('x', p.x).attr('y', p.y - H / 2 - 10).attr('text-anchor', 'middle').text(n.branch);
});
const depG = svg.append('g');
const nodeG = svg.append('g');
function draw() {
  nodeG.selectAll('*').remove(); depG.selectAll('*').remove();
  const lit = selected ? all(selected) : null;
  if (selected) {
    byId.get(selected).pre.forEach(pid => { const a = pos.get(pid), b = pos.get(selected); depG.append('path').attr('class', 'dep').attr('d', `M${a.x},${a.y} C${a.x},${(a.y + b.y) / 2} ${b.x},${(a.y + b.y) / 2} ${b.x},${b.y}`); });
  }
  const g = nodeG.selectAll('g').data(NODES, n => n.id).join('g')
    .attr('class', n => 'node ' + n.status + (selected ? (n.id === selected ? ' sel' : (lit.has(n.id) ? '' : ' dim')) : ''))
    .attr('id', n => 'n-' + n.id)
    .attr('transform', n => { const p = pos.get(n.id); return `translate(${p.x - W / 2},${p.y - H / 2})`; })
    .style('--c', n => n.color)
    .on('click', (ev, n) => { selected = selected === n.id ? null : n.id; draw(); show(n); });
  g.append('rect').attr('width', W).attr('height', H);
  g.append('text').attr('class', 'id').attr('x', 12).attr('y', 17).text(n => n.id + (n.status === 'done' ? '  ✓ пройдено' : n.status === 'playable' ? '  · доступно' : ''));
  g.append('text').attr('class', 't').attr('x', 12).attr('y', 35).text(n => n.ru.length > 28 ? n.ru.slice(0, 27) + '…' : n.ru);
}
function all(id, acc = new Set()) { (byId.get(id)?.pre || []).forEach(p => { if (!acc.has(p)) { acc.add(p); all(p, acc); } }); return acc; }
function show(n) {
  const d = document.getElementById('drawer');
  const status = { done: 'пройдено', playable: 'можно играть сейчас', plan: 'впереди' }[n.status];
  const pre = n.pre.length ? n.pre.map(p => `<button type="button" data-id="${p}">${p} · ${byId.get(p).ru}</button>`).join('') : '<span>нет, стартовая точка</span>';
  d.innerHTML = `<span class="eyebrow">${n.block}${n.branch ? ' · ' + n.branch : ' · ствол'}</span><h2>${n.id} · ${n.ru}</h2><p class="en">${n.en}</p><p>${n.goal}.</p>
    <dl><dt>Статус</dt><dd><span class="pill" style="--c:${n.color}">${status}</span></dd><dt>После</dt><dd class="pre">${pre}</dd></dl>`;
  d.querySelectorAll('button[data-id]').forEach(b => b.addEventListener('click', () => { const m = byId.get(b.dataset.id); selected = m.id; draw(); show(m); document.getElementById('n-' + m.id).scrollIntoView({ block: 'center', inline: 'center' }); }));
}
function goMe() { const f = NODES.find(n => n.status === 'playable') || NODES.find(n => n.status === 'done') || NODES[0]; document.getElementById('n-' + f.id).scrollIntoView({ block: 'center', inline: 'center' }); }
document.getElementById('go-me').addEventListener('click', goMe);
draw();
requestAnimationFrame(goMe);
</script>
</body>
</html>
